<div class="container-fluid p-3">
    <mat-icon class="float-end hover" (click)="closeModal()">close</mat-icon>

    <h1 class="titulo">Cadastro de Usuário</h1>
    <h2 class="subtitulo">Preencha o formulário com os dados do usuário</h2>

    <form class="row" [formGroup]="formUser">
        <div class="col-12 col-md-6 md-2">
            <mat-form-field class="example-full-width w-100">
                <mat-label>Nome</mat-label>
                <input type="text" matInput formControlName="name" placeholder="Digite o nome">
                @if (formUser.controls['name'].invalid) {
                  <mat-error>Preencha com um nome válido</mat-error>
                }
            </mat-form-field>
        </div>
        <div class="col-12 col-md-6 md-2">
            <mat-form-field class="example-full-width w-100">
                <mat-label>E-mail</mat-label>
                <input type="email" matInput formControlName="email" placeholder="Ex. exemplo@crud.com">
                @if (formUser.controls['email'].invalid) {
                  <mat-error>Preencha com um e-mail válido</mat-error>
                }
            </mat-form-field>
        </div>

        <div class="col-12 col-md-6 md-2">
            <mat-form-field class="example-full-width w-100">
                <mat-label>Id Empresa</mat-label>
                <input type="empresaid" matInput formControlName="empresaid">
            </mat-form-field>
        </div>

        <div class="col-12">
            <!-- Criar propriedade no nosso componente para aceitar ficar inativo -->
            <!-- <app-button textButton="Salvar" class="float-end"></app-button> -->
             <button class="botao-primario float-end" [disabled]="!formUser.valid">Salvar</button>
        </div>
    </form>
</div>
