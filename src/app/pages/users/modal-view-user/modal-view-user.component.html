<div class="container-fluid p-3">
    <mat-icon class="float-end hover" (click)="closeModal()">close</mat-icon>

    <h1 class="titulo">Detalhes do Usuário</h1>
    <h2 class="subtitulo">Visão detalhada do usuário</h2>

    <div class="row mt-3">
        <div class="col-12 col-md-6 mb-3">
            <h4 class="titulo-informacao">Nome</h4>
            <p class="informacao">{{userData.nome}}</p>
        </div>
        <div class="col-12 col-md-6 mb-3">
            <h4 class="titulo-informacao">E-mail</h4>
            <p class="informacao">{{userData.email}}</p>
        </div>
        
        <div class="col-12 col-md-6 mb-3">
            <h4 class="titulo-informacao">ID da Empresa</h4>
            <p class="informacao">{{userData.empresaId}}</p>
        </div>
    </div> 
    <div class="d-flex justify-content-end mt-4">
        <button mat-flat-button (click)="closeModal()">Fechar</button>
    </div>
</div>
