<div class="container-fluid p-3">
    <div class="header d-flex justify-content-between align-items-center mb-3">
        <h1 class="titulo">Lista de Fornecedores</h1>
        <button mat-raised-button color="primary" (click)="openFornecedorFormModal()">
            Adicionar Fornecedor
        </button>
    </div>

    <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>Filtrar</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Buscar por nome, CNPJ ou e-mail" #input>
    </mat-form-field>

    <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
                <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.razaosocial}} </td>
            </ng-container>

            <ng-container matColumnDef="cnpj">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> CNPJ </th>
                <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.cnpj}} </td>
            </ng-container>

            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> E-mail </th>
                <td mat-cell *matCellDef="let fornecedor"> {{fornecedor.email}} </td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef> Ações </th>
                <td mat-cell *matCellDef="let fornecedor">
                    <button mat-icon-button color="primary" (click)="openFornecedorFormModal(fornecedor)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button (click)="openModalViewFornecedor(fornecedor)">
                        <mat-icon>visibility</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteFornecedor(fornecedor.id)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="displayedColumns.length">Nenhum fornecedor encontrado com o filtro "{{input.value}}"</td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Selecione a página de fornecedores"></mat-paginator>
    </div>
</div>
