<div class="area-login-background d-none d-md-block"></div>

<div class="area-form">
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <h1 class="titulo">{{ nameSoftware }}</h1>
    <h2 class="subtitulo">{{ slogan }}</h2>

    <mat-form-field class="full-width-input">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" placeholder="Digite seu email">
      <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
        Email é obrigatório.
      </mat-error>
      <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
        Email inválido.
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width-input">
      <mat-label>Senha</mat-label>
      <input matInput formControlName="password" [type]="hidePassword() ? 'password' : 'text'" placeholder="Digite sua senha">
      <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button">
        <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
        Senha é obrigatória.
      </mat-error>
      <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
        A senha deve ter no mínimo 6 caracteres.
      </mat-error>
    </mat-form-field>

    <a (click)="recoverPassword()" class="forgot-password-link">Esqueci minha senha</a>

    <app-button textButton="Acessar" type="submit" [disabled]="loginForm.invalid"></app-button>

    <div *ngIf="errorMessage" class="error-message-box">
      {{ errorMessage }}
    </div>
  </form>

  <p class="footer">© 2024 | Desenvolvido por Micael Almeida</p>
</div>
