<header class="mobile-header">
  <button type="button" aria-label="Abrir menu" [attr.aria-expanded]="mobileOpen()" (click)="toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>
  <a routerLink="/vendas">
    <img src="assets/logo.png" alt="">
    <span>{{ nameSoftware }}</span>
  </a>
</header>

@if (mobileOpen()) {
  <button type="button" class="backdrop" aria-label="Fechar menu pelo fundo" (click)="closeMobileMenu()"></button>
}

<nav class="sidemenu" [class.collapsed]="collapsed()" [class.mobile-open]="mobileOpen()" aria-label="Navegação principal">
  <header class="menu-header">
    <button type="button" class="menu-toggle" [attr.aria-label]="mobileOpen() ? 'Fechar menu' : 'Alternar menu'" [attr.aria-expanded]="!collapsed()" (click)="toggleMenu()">
      <mat-icon>{{ mobileOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>
    <a class="brand" routerLink="/vendas" aria-label="Ir para vendas" (click)="closeMobileMenu()">
      <img src="assets/logo.png" alt="">
      <span>{{ nameSoftware }}</span>
    </a>
  </header>

  <div class="menu-links">
    <a routerLink="/vendas" routerLinkActive="active" title="Vendas" (click)="closeMobileMenu()"><mat-icon>shopping_cart</mat-icon><span>Vendas</span></a>
    <a routerLink="/users" routerLinkActive="active" title="Cadastrar usuário" (click)="closeMobileMenu()"><mat-icon>person_add</mat-icon><span>Cadastrar Usuário</span></a>
    @if (isSystemAdmin()) {
      <a routerLink="/empresas" routerLinkActive="active" title="Empresas" (click)="closeMobileMenu()"><mat-icon>business</mat-icon><span>Empresas</span></a>
    }
    <a routerLink="/fornecedores" routerLinkActive="active" title="Fornecedores" (click)="closeMobileMenu()"><mat-icon>handshake</mat-icon><span>Fornecedores</span></a>
    <a routerLink="/produtos" routerLinkActive="active" title="Produtos" (click)="closeMobileMenu()"><mat-icon>category</mat-icon><span>Produtos</span></a>
    <a routerLink="/stock" routerLinkActive="active" title="Estoque" (click)="closeMobileMenu()"><mat-icon>inventory_2</mat-icon><span>Estoque</span></a>
    <a routerLink="/cashier" routerLinkActive="active" title="Caixa" (click)="closeMobileMenu()"><mat-icon>account_balance_wallet</mat-icon><span>Caixa</span></a>
  </div>

  <button type="button" class="logout" title="Sair" (click)="logout()">
    <mat-icon>logout</mat-icon><span>Sair</span>
  </button>
</nav>
